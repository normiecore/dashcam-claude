name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: DashcamCore (Linux, swift test)
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tail -40

  app-simulator:
    # Xcode 26.6 and the iOS 26.5 SDK. macOS minutes bill at a multiple on this private repository,
    # so pull requests run only the Xcode 27 lane below; run this one from the Actions tab when a
    # change could behave differently on the older SDK.
    name: App (iOS Simulator, xcodebuild test)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd App && xcodegen generate
      - name: Build and test on Simulator
        run: |
          set -o pipefail
          xcodebuild -project App/Dashcam.xcodeproj -scheme Dashcam \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | grep --line-buffered -v -E '^ {4}(cd |/Applications/|builtin-|export )'

  app-simulator-xcode27:
    # Xcode 27 and the iOS 27 SDK, which is what the project is opened with. GitHub's xcode-27 label
    # is a public preview (macOS 27, Xcode 27.0 default, iOS 27.0 simulators).
    name: App (Xcode 27, iOS 27 Simulator)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write # publishes the screenshots to the simulator-preview branch
    env:
      TEST_FLAGS: >-
        -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300
        -collect-test-diagnostics never
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && xcrun simctl list devices available | grep -i iphone | head -5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd App && xcodegen generate
      - name: Boot the simulator
        # Booted up front so the UI test run can be recorded on a known device.
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = sorted((rt, d["udid"]) for rt, ds in devices.items() if ".iOS-27-" in rt for d in ds if d["name"] == "iPhone 17")
          print(found[0][1])')
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b
      - name: Build for testing
        id: build
        run: |
          set -o pipefail
          xcodebuild -project App/Dashcam.xcodeproj -scheme Dashcam -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | grep --line-buffered -v -E '^ {4}(cd |/Applications/|builtin-|export )'
      - name: Unit tests on Simulator
        run: |
          set -o pipefail
          xcodebuild -project App/Dashcam.xcodeproj -scheme Dashcam -destination "id=$SIM_UDID" \
            -skip-testing:DashcamUITests $TEST_FLAGS \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | grep --line-buffered -v -E '^ {4}(cd |/Applications/|builtin-|export )'
      - name: UI tests on Simulator, recorded
        # Runs even when a unit test failed, as the single `xcodebuild test` did; the job still fails.
        id: ui-tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/preview"
          # Job control, so the background recorder does not inherit an ignored SIGINT; SIGINT is
          # how recordVideo is told to finish the file.
          set -m
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force "$RUNNER_TEMP/preview/ui-tests.mov" > "$RUNNER_TEMP/recordVideo.log" 2>&1 &
          recorder=$!
          sleep 2
          status=0
          xcodebuild -project App/Dashcam.xcodeproj -scheme Dashcam -destination "id=$SIM_UDID" \
            -only-testing:DashcamUITests -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" $TEST_FLAGS \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | grep --line-buffered -v -E '^ {4}(cd |/Applications/|builtin-|export )' || status=$?
          kill -INT "$recorder" 2>/dev/null || true
          for _ in $(seq 30); do kill -0 "$recorder" 2>/dev/null || break; sleep 1; done
          kill -KILL "$recorder" 2>/dev/null && echo "::warning::recordVideo did not stop on SIGINT"
          cat "$RUNNER_TEMP/recordVideo.log"
          exit "$status"
      - name: Simulator preview
        # Screenshots from the UI tests and the recording, for previewing the app without a Mac.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PREVIEW_SOURCE: "From ${{ github.event.pull_request.html_url || github.ref_name }} at ${{ github.event.pull_request.head.sha || github.sha }}."
          UI_TESTS_OUTCOME: ${{ steps.ui-tests.outcome }}
        run: scripts/simulator-preview.sh "$RUNNER_TEMP/UITests.xcresult" "$RUNNER_TEMP/preview"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: simulator-preview
          path: ${{ runner.temp }}/preview
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish the preview to the simulator-preview branch
        # Viewable on GitHub from a phone: github.com/<repo>/tree/simulator-preview. Replaced on every run
        # that produced a preview, including one whose UI tests failed (its README says so).
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/preview/README.md" ] || { echo "No preview to publish."; exit 0; }
          dir=$(mktemp -d)
          find "$RUNNER_TEMP/preview" -maxdepth 1 -type f -exec cp {} "$dir" \;
          cd "$dir"
          git init -q -b simulator-preview
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Simulator preview of ${{ github.event.pull_request.head.sha || github.sha }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/simulator-preview
      - name: Archive Release for device (unsigned)
        # Debug builds carry the simulated camera and the UI-test launch options. This checks that the
        # shipping configuration and the device-only code paths compile without them, and that the
        # bundle has what an App Store Connect upload needs (icon, iPhone only, launch screen).
        run: |
          set -o pipefail
          xcodebuild -project App/Dashcam.xcodeproj -scheme Dashcam -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Dashcam.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive 2>&1 | grep --line-buffered -v -E '^ {4}(cd |/Applications/|builtin-|export )'
          scripts/check-app-bundle.sh "$RUNNER_TEMP/Dashcam.xcarchive/Products/Applications/Dashcam.app"
          sips -g hasAlpha App/Dashcam/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png | grep -q 'hasAlpha: no' \
            || { echo "::error::The app icon has an alpha channel (ITMS-90717)"; exit 1; }
      - name: Package unsigned IPA
        # For re-signing tools (free Apple Account sideloading); see docs/TESTING.md.
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Dashcam.xcarchive/Products/Applications/Dashcam.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/Dashcam-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/Dashcam-unsigned.ipa
          archive: false
          retention-days: 14
