name: Private native artwork render
on:
  push:
    branches: ['codex/natural-color-ios-20261015']
    paths: ['.github/artwork-input.enc.json', '.github/scripts/natural_artwork.py', '.github/workflows/natural-artwork.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the verified 0.1.2 rendering implementation
        run: git diff --exit-code 9744adf493c837c32f8663ac14f5aef04511ff5f HEAD -- NaturalColor/ios/HassyNatural NaturalColor/ios/project.yml
      - name: Install encryption support
        run: python3 -m venv "$RUNNER_TEMP/artwork-python" && "$RUNNER_TEMP/artwork-python/bin/pip" install --quiet cryptography
      - name: Retrieve authenticated private inputs without logging URLs
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: '"$RUNNER_TEMP/artwork-python/bin/python" .github/scripts/natural_artwork.py prepare'
      - name: Build native rendering test
        working-directory: NaturalColor/ios
        run: |
          brew install xcodegen
          xcodegen generate
          python3 scripts/select_simulator.py >> "$GITHUB_ENV"
      - name: Render the actual encoded app outputs
        working-directory: NaturalColor/ios
        run: |
          xcodebuild -project HassyNatural.xcodeproj -scheme HassyNatural -destination "id=$SIM_UDID" \
            -only-testing:HassyNaturalTests/PrivateArtworkRenderingTests -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/artwork-native.log" 2>&1 || \
            { grep -m 15 -E 'error:|failed|TEST FAILED' "$RUNNER_TEMP/artwork-native.log"; exit 1; }
          grep -E 'Test Case.*passed|TEST SUCCEEDED' "$RUNNER_TEMP/artwork-native.log"
      - name: Encrypt native outputs for the requesting workspace
        run: |
          app_data="$(xcrun simctl get_app_container "$SIM_UDID" com.normiecore.hassynatural data)"
          "$RUNNER_TEMP/artwork-python/bin/python" .github/scripts/natural_artwork.py seal "$app_data/Documents/Artwork"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-native-artwork
          path: |
            ${{ runner.temp }}/natural-artwork/output.enc
            ${{ runner.temp }}/natural-artwork/output-envelope.json
          retention-days: 1
      - name: Remove private working files
        if: always()
        run: |
          rm -rf NaturalColor/ios/HassyNaturalTests/Fixtures
          rm -rf "$RUNNER_TEMP/natural-artwork"
