name: HassyNatural
options:
  bundleIdPrefix: com.normiecore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
targets:
  HassyNatural:
    type: application
    platform: iOS
    sources:
      - path: HassyNatural
        excludes:
          - Imaging/NaturalKernel.swift
          - Imaging/NaturalKernel.ci.metal
          - Resources/*.provenance.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normiecore.hassynatural
        PRODUCT_NAME: HassyNatural
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: HassyNatural/Core/BridgingHeader.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MTL_COMPILER_FLAGS: "$(inherited) -fcikernel"
        MTLLINKER_FLAGS: "$(inherited) -cikernel"
        MTL_FAST_MATH: NO
    info:
      path: HassyNatural/Resources/Info.plist
      properties:
        CFBundleDisplayName: Natural
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Use the camera to take photos.
        NSPhotoLibraryAddUsageDescription: Save your photos to the photo library. RAW originals are optional in Settings.
    scheme:
      testTargets:
        - HassyNaturalTests
        - HassyNaturalUITests
      gatherCoverageData: true
  HassyNaturalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HassyNaturalTests
        excludes:
          - Fixtures
          - NaturalRenderingTests.swift
      - path: HassyNaturalTests/Fixtures
        type: folder
        optional: true
    dependencies:
      - target: HassyNatural
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normiecore.hassynatural.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: HassyNatural/Core/BridgingHeader.h
  HassyNaturalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HassyNaturalUITests
    dependencies:
      - target: HassyNatural
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normiecore.hassynatural.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HassyNatural
