plugins { id 'com.android.application' }

android {
    namespace 'com.daz.dashcam'
    compileSdk 35
    defaultConfig {
        applicationId 'com.daz.dashcam'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0-dev.1'
        testInstrumentationRunner 'com.daz.dashcam.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
    def prototypeKeystore = System.getenv('DASHCAM_DEBUG_KEYSTORE')
    if (prototypeKeystore) {
        signingConfigs.debug {
            storeFile file(prototypeKeystore)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    lint { abortOnError true }
}
