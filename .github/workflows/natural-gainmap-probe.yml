name: Natural gain-map API probe
on:
  push:
    branches: ['codex/natural-round4-release-20261019']
    paths:
      - 'NaturalColor/verification/probe_gainmap.swift'
      - '.github/workflows/natural-gainmap-probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  synthetic-gain-map-matrix:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Core Image gain-map writers with synthetic float pixels
        run: xcrun swift NaturalColor/verification/probe_gainmap.swift

  decode-simulator-output:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the synthetic HEIC produced by the actual simulator app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39206541891 --repo "$GITHUB_REPOSITORY" --name natural-round4-images --dir "$RUNNER_TEMP/round4-images"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/round4-images/Round4Images.xcresult" --output-path "$RUNNER_TEMP/round4-attachments"
      - name: Independently decode the simulator app output on native macOS
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          from pathlib import Path
          images = list(Path(os.environ['RUNNER_TEMP'], 'round4-attachments').rglob('*.heic'))
          assert images, 'Missing exported HEIC attachment'
          subprocess.run(['xcrun', 'swift', 'NaturalColor/verification/probe_gainmap.swift', '--decode', *map(str, images)], check=True)
          PYCODE
