name: Hassy Natural Apple status
on:
  push:
    branches: ['codex/natural-color-ios-20261015']
    paths:
      - '.github/workflows/natural-status.yml'
      - '.github/scripts/natural_status.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-status:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Apple processing and internal build access without uploading
        run: python3 .github/scripts/natural_status.py
