name: HassyNatural
options:
  bundleIdPrefix: com.normiecore
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
targets:
  HassyNatural:
    type: application
    platform: iOS
    sources:
      - path: HassyNatural
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normiecore.hassynatural
        PRODUCT_NAME: HassyNatural
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: HassyNatural/Core/BridgingHeader.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: HassyNatural/Resources/Info.plist
      properties:
        CFBundleDisplayName: Hassy Natural
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Hassy Natural uses the camera to take photos you choose to edit.
        NSPhotoLibraryAddUsageDescription: Save edited copies to your photo library. Your originals are preserved.
    scheme:
      testTargets:
        - HassyNaturalTests
        - HassyNaturalUITests
      gatherCoverageData: true
  HassyNaturalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HassyNaturalTests
    dependencies:
      - target: HassyNatural
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normiecore.hassynatural.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: HassyNatural/Core/BridgingHeader.h
  HassyNaturalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HassyNaturalUITests
    dependencies:
      - target: HassyNatural
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normiecore.hassynatural.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HassyNatural
