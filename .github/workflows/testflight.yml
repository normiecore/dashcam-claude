name: TestFlight

# Archives a Release build, signs it with Apple's cloud-managed distribution certificate and uploads
# it to App Store Connect for TestFlight. No Mac and no certificate files are needed: signing uses an
# App Store Connect team API key with the Admin role. Start it from Actions > TestFlight > Run
# workflow (builds the chosen branch, normally main), or by adding the "testflight" label to an open
# pull request (builds that pull request). Both work from a phone browser. The secrets it needs and
# the one-time App Store Connect setup are in docs/TESTING.md.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  preflight:
    # A Linux job, so a missing secret fails in seconds without starting a billed macOS runner.
    name: Check signing secrets
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'testflight'
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions (docs/TESTING.md, Installing with TestFlight)."
            exit 1
          fi
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) ;;
            *) echo "::error::ASC_KEY_P8 does not look like the text of an AuthKey_*.p8 file (no BEGIN PRIVATE KEY line)."; exit 1;;
          esac
          echo "Secrets present."

  upload:
    name: Archive, sign and upload
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 45
    # On the job, not the workflow, so runs started by other labels (all skipped) never join the group
    # and replace a waiting upload. An upload in progress is never cancelled.
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build number
        # From the clock (UTC date.time), so it always goes up, even when an older run is re-run;
        # App Store Connect rejects a build number lower than one already uploaded for the version.
        run: echo "BUILD_NUMBER=$(date -u +%Y%m%d).$((10#$(date -u +%H%M)))" >> "$GITHUB_ENV"
      - name: Toolchain
        # Uploads must come from a released Xcode. The image also carries Xcode 27.1 and 27.2 betas.
        run: |
          if [ -d /Applications/Xcode_27.app ]; then sudo xcode-select -s /Applications/Xcode_27.app; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd App && DASHCAM_TEAM_ID="$APPLE_TEAM_ID" xcodegen generate
      - name: Write the API key
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive
        # Ad hoc signed, as Xcode Cloud does: no development certificate or registered device is
        # needed. The export below re-signs for distribution.
        run: |
          set -o pipefail
          xcodebuild -project App/Dashcam.xcodeproj -scheme Dashcam -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Dashcam.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | grep --line-buffered -v -E '^ {4}(cd |/Applications/|builtin-|export )'
      - name: Check the bundle
        run: |
          scripts/check-app-bundle.sh "$RUNNER_TEMP/Dashcam.xcarchive/Products/Applications/Dashcam.app" "$BUILD_NUMBER"
          sips -g hasAlpha App/Dashcam/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png | grep -q 'hasAlpha: no' \
            || { echo "::error::The app icon has an alpha channel (ITMS-90717)"; exit 1; }
      - name: Sign and upload
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dashcam.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          echo "Uploaded build $BUILD_NUMBER. It appears in TestFlight once App Store Connect finishes processing, usually 5 to 30 minutes."
      - name: Collect export logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP/export.log" "$RUNNER_TEMP/logs/" 2>/dev/null || true
          grep -oE '/[^ ]+\.xcdistributionlogs' "$RUNNER_TEMP/export.log" 2>/dev/null | sort -u | while read -r dir; do
            cp -R "$dir" "$RUNNER_TEMP/logs/" || true
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testflight-logs
          path: ${{ runner.temp }}/logs
          retention-days: 14
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
